<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>

    <style>
        .menu {
            width: 100%;
            height: 100px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            background-color: #e5bdf5;
            border: 2px solid rgb(204, 108, 204);
            position: relative;
        }
        .nombre {
            width: 40%;
            height: 50px;
            margin-left: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #d68cf3;
            border: 2px solid rgb(204, 108, 204);
            
            font-weight: bold;
        }
        .botones {
            width: 15%;
            height: 50px;
            margin-left: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #d68cf3;
            border: 2px solid rgb(204, 108, 204);
            cursor: pointer;
        }

       
        .contacto-box {
            width: 75%;
            margin: 50px auto;
            padding: 20px;
            background-color: #cdabf5;
            border: 2px solid rgb(173, 40, 214);
        }

        .contacto-box input{
            width: 90%;
            margin-top: 10px;
            padding: 8px;
            border: 2px solid rgb(204,108,204);
            background-color: #f8e9ff;
        }
        .contacto-box textarea {
            width: 90%;
            margin-top: 10px;
            padding: 8px;
            border: 2px solid rgb(204,108,204);
            background-color: #f8e9ff;
        }

        .enviar {
            margin-top: 15px;
            padding: 10px;
            background-color: #d68cf3;
            border: 2px solid rgb(204,108,204);
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .footer {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 150px; 
            background-color: #e5bdf5;
            border: 2px solid rgb(204, 108, 204);
        }
    </style>
</head>

<body>

    <div class="menu">
        <div class="nombre">NOMBRE</div>
        <div class="botones"><a style="text-decoration: none; color: black;" href="acerca_de.html">Acerca de</a></div> 
        <div class="botones"><a style="text-decoration: none; color: black;" href="ofertas.html">Ofertas</a></div> 
        <div class="botones"><a style="text-decoration: none; color: black;" href="index.html">Volver</a></div>  
    </div>

    <div class="contacto-box">
        <h2>Contacto</h2>
        <input type="text" placeholder="Tu nombre">
        <input type="email" placeholder="Tu correo">
        <textarea rows="4" placeholder="Tu mensaje"></textarea>

        <button class="enviar">Enviar</button>
    </div>

    <div class="footer"></div>

</body>
</html>
