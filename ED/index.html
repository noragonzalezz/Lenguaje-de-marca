<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index</title>
    <style>
        .menu {
            width: 100%;
            height: 100px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            background-color: #e5bdf5;
            border: 2px solid rgb(204, 108, 204);
            position: relative; 
        }
        .nombre {
            width: 40%;
            height: 50px;
            margin-left: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #d68cf3;
            border: 2px solid rgb(204, 108, 204);
        } 
        .botones {
            width: 15%;
            height: 50px;
            margin-left: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #d68cf3;
            border: 2px solid rgb(204, 108, 204);
        }

        
        .carrito {
            position: relative;
            right: 20px;
            top: 100px;
            width: 60px;
            height: 60px;
            background-color: #d68cf3;
            border: 2px solid rgb(204, 108, 204);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            color: white;
            cursor: pointer;
        }
        .carrito:hover {
            background-color: #c987e4;
            transform: scale(1.1);
        }

        .coleccion {
            width: 75%;
            height: 275px;
            margin-top: 20px;
            background-color: #cdabf5;
            border: 2px solid rgb(173, 40, 214);
        }
        .coleccion:hover {
            background-color: #c987e4;
            transform: scale(1.02);
        }
        
        .footer {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 150px; 
            background-color: #e5bdf5;
            border: 2px solid rgb(204, 108, 204);
        }
        
    </style>

</html>
